<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>House of Cochran Autonomous Frame</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #e2e8f0;
      }
      .card {
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 16px;
        padding: 32px 40px;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.45);
        text-align: center;
        max-width: 720px;
      }
      h1 {
        margin-top: 0;
        font-size: 2.2rem;
      }
      p {
        font-size: 1.1rem;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .button {
        display: inline-block;
        background: #38bdf8;
        color: #082f49;
        text-decoration: none;
        font-weight: 700;
        padding: 14px 24px;
        border-radius: 10px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 12px 25px rgba(56, 189, 248, 0.35);
      }
      .button:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 30px rgba(56, 189, 248, 0.45);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>House of Cochran Autonomous Frame</h1>
      <p>Welcome to the autonomous frame project. Use the button below to open the official project document.</p>
      <a class="button" href="https://drive.google.com/file/d/1M3TaesFuacj6Cfy9Muil7xX71NmhbmF0/view?usp=drivesdk">Open the project document</a>
    </div>
  </body>
</html>
